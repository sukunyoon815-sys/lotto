<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎱 행운의 로또 추첨</title>
  <meta name="description" content="행운의 로또 번호를 자동 생성해보세요!" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg-1: #0f0c29; --bg-2: #302b63; --bg-3: #24243e; --gold: #ffd700; --text: #fff; }
    body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; min-height: 100vh; background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3)); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden; }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 20px 0 10px; background: linear-gradient(90deg, #ffd700, #ff8c00, #ffd700); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-align: center; animation: shimmer 3s infinite; }
    @keyframes shimmer { 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.3);} }
    .subtitle { color: #bbb; margin-bottom: 30px; text-align: center; }
    .machine { width: 100%; max-width: 600px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .sets-container { display:flex; flex-direction:column; gap:15px; min-height:90px; margin-bottom:20px; }
    .set-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px; background:rgba(0,0,0,0.2); border-radius:12px; animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from{opacity:0;transform:translateX(-20px);} to{opacity:1;transform:translateX(0);} }
    .set-label { font-size:0.85rem; color:var(--gold); font-weight:bold; min-width:40px; }
    .set-balls { display:flex; gap:8px; flex-wrap:wrap; flex:1; }
    .ball { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:bold; color:#fff; box-shadow: inset -4px -4px 10px rgba(0,0,0,0.4), inset 4px 4px 10px rgba(255,255,255,0.3), 0 4px 10px rgba(0,0,0,0.5); position:relative; animation: pop 0.5s ease-out; }
    .ball.bonus { border: 3px dashed var(--gold); }
    .ball::before { content:''; position:absolute; top:10%; left:20%; width:12px; height:12px; background:rgba(255,255,255,0.5); border-radius:50%; filter: blur(2px); }
    .ball-yellow { background: radial-gradient(circle at 30% 30%, #fff38a, #f5c400); color: #333; }
    .ball-blue   { background: radial-gradient(circle at 30% 30%, #7fb3ff, #2b6cff); }
    .ball-red    { background: radial-gradient(circle at 30% 30%, #ff9a9a, #e63946); }
    .ball-gray   { background: radial-gradient(circle at 30% 30%, #cccccc, #666666); }
    .ball-green  { background: radial-gradient(circle at 30% 30%, #9fffa0, #2eb82e); }
    @keyframes pop { 0%{transform:scale(0) rotate(-180deg); opacity:0;} 60%{transform:scale(1.2) rotate(20deg);} 100%{transform:scale(1) rotate(0); opacity:1;} }
    .rolling { animation: roll 0.1s linear infinite; }
    @keyframes roll { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .count-selector { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:20px; padding:12px; background:rgba(0,0,0,0.2); border-radius:50px; }
    .count-label { font-size:0.95rem; color:#ccc; }
    .count-btn { width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,0.15); color:#fff; font-size:1.2rem; font-weight:bold; cursor:pointer; transition:all 0.2s; display:flex; align-items:center; justify-content:center; padding:0; }
    .count-btn:hover:not(:disabled) { background:rgba(255,215,0,0.3); transform:scale(1.1); }
    .count-btn:disabled { opacity:0.3; cursor:not-allowed; }
    .count-display { font-size:1.5rem; font-weight:bold; color:var(--gold); min-width:50px; text-align:center; }
    .count-unit { font-size:0.9rem; color:#aaa; }
    .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px; }
    button { padding:14px 28px; font-size:1rem; font-weight:bold; border:none; border-radius:50px; cursor:pointer; transition:all 0.3s; color:#fff; }
    .btn-primary { background: linear-gradient(135deg, #ff8c00, #ffd700); color:#222; box-shadow: 0 4px 15px rgba(255,215,0,0.4); }
    .btn-primary:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,215,0,0.6); }
    .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
    .btn-secondary { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); }
    .btn-secondary:hover { background:rgba(255,255,255,0.2); }
    .history { width:100%; max-width:600px; margin-top:30px; background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:20px; }
    .history h2 { font-size:1.3rem; margin-bottom:15px; color:var(--gold); display:flex; justify-content:space-between; align-items:center; }
    .history-list { display:flex; flex-direction:column; gap:12px; max-height:300px; overflow-y:auto; }
    .history-item { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px; background:rgba(0,0,0,0.2); border-radius:10px; }
    .history-item .ball { width:36px; height:36px; font-size:0.9rem; animation:none; }
    .history-item .time { font-size:0.8rem; color:#aaa; margin-left:auto; }
    .empty-history { text-align:center; color:#888; padding:20px; }
    .clear-btn { background:transparent; border:1px solid rgba(255,255,255,0.3); color:#ccc; padding:4px 10px; font-size:0.8rem; border-radius:20px; cursor:pointer; }
    .progress-bar { width:100%; height:4px; background:rgba(255,255,255,0.1); border-radius:2px; margin-bottom:15px; overflow:hidden; display:none; }
    .progress-bar.active { display:block; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#ff8c00,#ffd700); width:0%; transition:width 0.3s; }
    footer { margin-top:40px; color:#888; font-size:0.85rem; text-align:center; }
    @media (max-width:480px) { .ball { width:42px; height:42px; font-size:1.1rem; } .history-item .ball { width:32px; height:32px; font-size:0.8rem; } .set-label { min-width:35px; font-size:0.8rem; } }
  </style>
</head>
<body>
  <h1>🎱 행운의 로또 추첨</h1>
  <p class="subtitle">1~45 중 6개 번호 + 보너스 번호를 뽑아보세요!</p>
  <div class="machine">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="sets-container" id="setsContainer"><div style="color:#888; text-align:center; padding:20px;">버튼을 눌러 번호를 생성하세요 ✨</div></div>
    <div class="count-selector">
      <span class="count-label">생성 개수</span>
      <button class="count-btn" id="decreaseBtn" aria-label="감소">−</button>
      <span class="count-display" id="countDisplay">1</span>
      <span class="count-unit">세트</span>
      <button class="count-btn" id="increaseBtn" aria-label="증가">+</button>
    </div>
    <div class="controls">
      <button class="btn-primary" id="drawBtn">🎲 번호 추첨</button>
      <button class="btn-secondary" id="resetBtn">🔄 초기화</button>
    </div>
  </div>
  <div class="history">
    <h2>📜 추첨 기록 <button class="clear-btn" id="clearBtn">기록 삭제</button></h2>
    <div class="history-list" id="historyList"><div class="empty-history">아직 기록이 없습니다.</div></div>
  </div>
  <footer><p>🍀 이 사이트는 재미를 위한 것이며, 당첨을 보장하지 않습니다.</p><p>Powered by Cloudflare Pages</p></footer>
  <script>
    const setsContainer = document.getElementById('setsContainer');
    const historyList = document.getElementById('historyList');
    const drawBtn = document.getElementById('drawBtn');
    const resetBtn = document.getElementById('resetBtn');
    const clearBtn = document.getElementById('clearBtn');
    const decreaseBtn = document.getElementById('decreaseBtn');
    const increaseBtn = document.getElementById('increaseBtn');
    const countDisplay = document.getElementById('countDisplay');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const STORAGE_KEY = 'lotto_history';
    const COUNT_KEY = 'lotto_count';
    const MAX_COUNT = 5;
    let currentCount = parseInt(localStorage.getItem(COUNT_KEY)) || 1;
    function updateCountUI() { countDisplay.textContent = currentCount; decreaseBtn.disabled = currentCount <= 1; increaseBtn.disabled = currentCount >= MAX_COUNT; localStorage.setItem(COUNT_KEY, currentCount); }
    function getBallClass(num) { if (num <= 10) return 'ball-yellow'; if (num <= 20) return 'ball-blue'; if (num <= 30) return 'ball-red'; if (num <= 40) return 'ball-gray'; return 'ball-green'; }
    function createBall(num, isBonus = false) { const ball = document.createElement('div'); ball.className = `ball ${getBallClass(num)}${isBonus ? ' bonus' : ''}`; ball.textContent = num; ball.title = isBonus ? '보너스 번호' : ''; return ball; }
    function drawNumbers() { const numbers = new Set(); while (numbers.size < 7) numbers.add(Math.floor(Math.random() * 45) + 1); const arr = [...numbers]; return { main: arr.slice(0, 6).sort((a, b) => a - b), bonus: arr[6] }; }
    async function animateSet(setIndex, totalSets) { const setRow = document.createElement('div'); setRow.className = 'set-row'; const label = document.createElement('span'); label.className = 'set-label'; label.textContent = `#${setIndex + 1}`; setRow.appendChild(label); const ballsContainer = document.createElement('div'); ballsContainer.className = 'set-balls'; setRow.appendChild(ballsContainer); setsContainer.appendChild(setRow); const { main, bonus } = drawNumbers(); const allNumbers = [...main, bonus]; for (let i = 0; i < allNumbers.length; i++) { const isBonus = i === allNumbers.length - 1; const finalNum = allNumbers[i]; const rollingBall = document.createElement('div'); rollingBall.className = `ball ${getBallClass(finalNum)} rolling`; rollingBall.textContent = '?'; ballsContainer.appendChild(rollingBall); const interval = setInterval(() => { rollingBall.textContent = Math.floor(Math.random() * 45) + 1; }, 60); await new Promise(r => setTimeout(r, 500)); clearInterval(interval); rollingBall.classList.remove('rolling'); rollingBall.textContent = finalNum; if (isBonus) rollingBall.classList.add('bonus'); await new Promise(r => setTimeout(r, 150)); } const progress = ((setIndex + 1) / totalSets) * 100; progressFill.style.width = `${progress}%`; return { main, bonus }; }
    async function animateDraw() { drawBtn.disabled = true; decreaseBtn.disabled = true; increaseBtn.disabled = true; setsContainer.innerHTML = ''; progressBar.classList.add('active'); progressFill.style.width = '0%'; const results = []; const time = new Date().toLocaleString('ko-KR'); for (let i = 0; i < currentCount; i++) { const result = await animateSet(i, currentCount); results.push(result); if (i < currentCount - 1) await new Promise(r => setTimeout(r, 400)); } results.forEach(result => saveHistory({ ...result, time })); renderHistory(); setTimeout(() => { progressBar.classList.remove('active'); drawBtn.disabled = false; updateCountUI(); }, 500); }
    function saveHistory(entry) { const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); history.unshift(entry); if (history.length > 50) history.pop(); localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); }
    function renderHistory() { const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); if (history.length === 0) { historyList.innerHTML = '<div class="empty-history">아직 기록이 없습니다.</div>'; return; } historyList.innerHTML = ''; history.forEach(entry => { const item = document.createElement('div'); item.className = 'history-item'; entry.main.forEach(n => item.appendChild(createBall(n))); item.appendChild(createBall(entry.bonus, true)); const time = document.createElement('span'); time.className = 'time'; time.textContent = entry.time; item.appendChild(time); historyList.appendChild(item); }); }
    function reset() { setsContainer.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">버튼을 눌러 번호를 생성하세요 ✨</div>'; progressBar.classList.remove('active'); progressFill.style.width = '0%'; }
    drawBtn.addEventListener('click', animateDraw);
    resetBtn.addEventListener('click', reset);
    clearBtn.addEventListener('click', () => { if (confirm('모든 기록을 삭제하시겠습니까?')) { localStorage.removeItem(STORAGE_KEY); renderHistory(); } });
    decreaseBtn.addEventListener('click', () => { if (currentCount > 1) { currentCount--; updateCountUI(); } });
    increaseBtn.addEventListener('click', () => { if (currentCount < MAX_COUNT) { currentCount++; updateCountUI(); } });
    updateCountUI();
    renderHistory();
  </script>
</body>
</html>
